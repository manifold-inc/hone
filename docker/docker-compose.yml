# Hone training stack: 1 validator + 1 miner split across N pipeline
# stages, all sharing the same wallet hotkey (the network sees one
# UID per (cold, hot) pair regardless of how many stage containers
# back it).
#
# Layout (default values shown for the GPU map; override via .env):
#
#   validator           GPU 0          (FSDP within the process)
#   miner-s0            GPU 1          (PP stage 0)
#   miner-s1            GPU 2          (PP stage 1)
#
# Each stage is its own service so we can pin a specific GPU to it
# and inspect its logs in isolation. The PP transport's
# --pp-peer-host-{prev,next} just point at the sibling service name;
# Docker's embedded DNS does the rest. Listen ports stay the same
# across stages (each container is in its own netns, no collision).
#
# To add stage 2 / 3 / N for a deeper pipeline: copy the miner-s1
# block, rename to miner-s{N}, set PP_STAGE=N and PP_NUM_STAGES=N+1
# on every stage, and chain PP_PEER_HOST_NEXT/PREV through. Make sure
# ``pipeline.num_stages`` in hparams.json matches.

x-common-env: &common-env
  # R2 / S3 credentials (gradients + dataset). Read from .env.
  R2_GRADIENTS_ACCOUNT_ID: ${R2_GRADIENTS_ACCOUNT_ID}
  R2_GRADIENTS_BUCKET_NAME: ${R2_GRADIENTS_BUCKET_NAME}
  R2_GRADIENTS_READ_ACCESS_KEY_ID: ${R2_GRADIENTS_READ_ACCESS_KEY_ID}
  R2_GRADIENTS_READ_SECRET_ACCESS_KEY: ${R2_GRADIENTS_READ_SECRET_ACCESS_KEY}
  R2_GRADIENTS_WRITE_ACCESS_KEY_ID: ${R2_GRADIENTS_WRITE_ACCESS_KEY_ID}
  R2_GRADIENTS_WRITE_SECRET_ACCESS_KEY: ${R2_GRADIENTS_WRITE_SECRET_ACCESS_KEY}
  R2_AGGREGATOR_ACCOUNT_ID: ${R2_AGGREGATOR_ACCOUNT_ID:-}
  R2_AGGREGATOR_BUCKET_NAME: ${R2_AGGREGATOR_BUCKET_NAME:-}
  R2_AGGREGATOR_READ_ACCESS_KEY_ID: ${R2_AGGREGATOR_READ_ACCESS_KEY_ID:-}
  R2_AGGREGATOR_READ_SECRET_ACCESS_KEY: ${R2_AGGREGATOR_READ_SECRET_ACCESS_KEY:-}
  R2_AGGREGATOR_WRITE_ACCESS_KEY_ID: ${R2_AGGREGATOR_WRITE_ACCESS_KEY_ID:-}
  R2_AGGREGATOR_WRITE_SECRET_ACCESS_KEY: ${R2_AGGREGATOR_WRITE_SECRET_ACCESS_KEY:-}
  R2_DATASET_ACCOUNT_ID: ${R2_DATASET_ACCOUNT_ID}
  R2_DATASET_BUCKET_NAME: ${R2_DATASET_BUCKET_NAME}
  R2_DATASET_READ_ACCESS_KEY_ID: ${R2_DATASET_READ_ACCESS_KEY_ID}
  R2_DATASET_READ_SECRET_ACCESS_KEY: ${R2_DATASET_READ_SECRET_ACCESS_KEY}
  DATASET_BINS_PATH: ${DATASET_BINS_PATH:-tokenized/}
  # Optional integrations.
  WANDB_API_KEY: ${WANDB_API_KEY:-}
  HF_TOKEN: ${HF_TOKEN:-}
  DASHBOARD_API_URL: ${DASHBOARD_API_URL:-https://api.hone.training}
  DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-}
  # Subtensor / chain.
  NETUID: ${NETUID:-268}
  SUBTENSOR_NETWORK: ${SUBTENSOR_NETWORK:-finney}
  SUBTENSOR_CHAIN_ENDPOINT: ${SUBTENSOR_CHAIN_ENDPOINT:-}
  # NCCL: stick to a single device per process within each container,
  # the entrypoint flips to torchrun when NPROC_PER_NODE > 1.
  NCCL_ASYNC_ERROR_HANDLING: "1"
  NCCL_IB_DISABLE: "1"
  NCCL_P2P_DISABLE: "0"

x-build: &build
  context: ..
  dockerfile: docker/Dockerfile

x-common-volumes: &common-volumes
  # Wallet directory shared across the host -- each container reads
  # ~/.bittensor/wallets/<WALLET_NAME>/hotkeys/<WALLET_HOTKEY>.
  - ${BITTENSOR_WALLETS_DIR:-~/.bittensor/wallets}:/root/.bittensor/wallets:ro
  # Mount the source tree over /app so edits to hone/* land instantly
  # (the package was installed in editable mode in the Dockerfile).
  - ../:/app:rw
  # Logs land here.
  - ./logs:/app/logs:rw
  # Reuse the host's HF cache so we don't redownload tokenizers per
  # container (-> 3 hits per stack startup otherwise).
  - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface

# Bridge network. Containers reach each other by service name
# (miner-s0 connects to miner-s1) over Docker's embedded DNS.
networks:
  hone-net:
    driver: bridge

services:

  # ----------------------------- VALIDATOR ---------------------------
  validator:
    build: *build
    image: hone:latest
    hostname: validator
    container_name: hone-validator
    networks: [hone-net]
    volumes: *common-volumes
    environment:
      <<: *common-env
      NODE_TYPE: validator
      WALLET_NAME: ${VALIDATOR_WALLET_NAME}
      WALLET_HOTKEY: ${VALIDATOR_WALLET_HOTKEY}
      HONE_EXTRA_FLAGS: ${VALIDATOR_EXTRA_FLAGS:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VALIDATOR_GPU_ID:-0}"]
              capabilities: [gpu]
    restart: unless-stopped

  # ----------------------------- MINER STAGES ------------------------
  # All stages share ${MINER_WALLET_NAME}/${MINER_WALLET_HOTKEY} -- the
  # subnet sees one UID, with per-stage gradient files on R2 keyed by
  # the ``-stage{N}`` suffix that ``Comms.put`` adds when ``stage_id``
  # is set.

  miner-s0:
    build: *build
    image: hone:latest
    hostname: miner-s0
    container_name: hone-miner-s0
    networks: [hone-net]
    volumes: *common-volumes
    environment:
      <<: *common-env
      NODE_TYPE: miner
      WALLET_NAME: ${MINER_WALLET_NAME}
      WALLET_HOTKEY: ${MINER_WALLET_HOTKEY}
      PP_STAGE: "0"
      PP_NUM_STAGES: "${PP_NUM_STAGES:-2}"
      # Stage 0 only sends *forward* to stage 1 and receives *grad*
      # back. ``--pp-peer-host-prev`` is unused on stage 0; we pass the
      # default 127.0.0.1 from the entrypoint.
      PP_PEER_HOST_NEXT: miner-s1
      PP_PEER_PORT_BASE_NEXT: "50000"
      PP_LISTEN_PORT_BASE: "50000"
      HONE_EXTRA_FLAGS: ${MINER_EXTRA_FLAGS:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${MINER_S0_GPU_ID:-1}"]
              capabilities: [gpu]
    depends_on: [validator]
    restart: unless-stopped

  miner-s1:
    build: *build
    image: hone:latest
    hostname: miner-s1
    container_name: hone-miner-s1
    networks: [hone-net]
    volumes: *common-volumes
    environment:
      <<: *common-env
      NODE_TYPE: miner
      WALLET_NAME: ${MINER_WALLET_NAME}
      WALLET_HOTKEY: ${MINER_WALLET_HOTKEY}
      PP_STAGE: "1"
      PP_NUM_STAGES: "${PP_NUM_STAGES:-2}"
      PP_PEER_HOST_PREV: miner-s0
      PP_PEER_PORT_BASE_PREV: "50000"
      PP_LISTEN_PORT_BASE: "50000"
      HONE_EXTRA_FLAGS: ${MINER_EXTRA_FLAGS:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${MINER_S1_GPU_ID:-2}"]
              capabilities: [gpu]
    depends_on: [validator]
    restart: unless-stopped
