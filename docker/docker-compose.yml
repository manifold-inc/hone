# Hone training stack: 1 validator + 1 miner split across N pipeline
# stages, all sharing the same wallet hotkey (the network sees one
# UID per (cold, hot) pair regardless of how many stage containers
# back it).
#
# Default 8-GPU layout (override via .env):
#
#   validator           GPUs 0,1       (FSDP, NPROC=2)
#   miner-s0            GPUs 2,3       (PP stage 0, FSDP NPROC=2)
#   miner-s1            GPUs 4,5       (PP stage 1, FSDP NPROC=2)
#   miner-s2            GPUs 6,7       (PP stage 2, FSDP NPROC=2)
#
# Each stage is its own service so we can pin specific GPUs to it
# and inspect its logs in isolation. The PP transport's
# --pp-peer-host-{prev,next} just point at the sibling service name;
# Docker's embedded DNS does the rest. Listen ports stay the same
# across stages (each container is in its own netns, no collision).
#
# IMPORTANT GPU/NPROC constraints (see hone/docker/.env for details):
#   1. ``MINER_S*_NPROC`` MUST all be equal -- the PP transport pairs
#      ranks 1-to-1 across stages and the sampler strides by
#      ``rank :: world_size``, so asymmetric NPROC hangs and desyncs.
#   2. Each NPROC must be a divisor of the model ``hidden_dim`` (2048
#      for 8B-A1B). FSDP pads weight shards along dim 0 when the dim
#      isn't divisible, and the padded full shape then mismatches the
#      original param shape during ``restore_offloaded_params``.
#      Valid values for hidden_dim=2048: {1, 2, 4, 8}.
#
# To bump the pipeline to N stages: copy the miner-s1 block (which is
# already a middle stage with both PREV and NEXT chained), rename to
# miner-s{N-1}/.../miner-s{K}, set PP_STAGE on each, and update
# ``PP_NUM_STAGES`` + ``pipeline.num_stages`` in hparams.json.

x-common-env: &common-env
  # R2 / S3 credentials (gradients + dataset). Read from .env.
  R2_GRADIENTS_ACCOUNT_ID: ${R2_GRADIENTS_ACCOUNT_ID}
  R2_GRADIENTS_BUCKET_NAME: ${R2_GRADIENTS_BUCKET_NAME}
  R2_GRADIENTS_READ_ACCESS_KEY_ID: ${R2_GRADIENTS_READ_ACCESS_KEY_ID}
  R2_GRADIENTS_READ_SECRET_ACCESS_KEY: ${R2_GRADIENTS_READ_SECRET_ACCESS_KEY}
  R2_GRADIENTS_WRITE_ACCESS_KEY_ID: ${R2_GRADIENTS_WRITE_ACCESS_KEY_ID}
  R2_GRADIENTS_WRITE_SECRET_ACCESS_KEY: ${R2_GRADIENTS_WRITE_SECRET_ACCESS_KEY}
  R2_AGGREGATOR_ACCOUNT_ID: ${R2_AGGREGATOR_ACCOUNT_ID:-}
  R2_AGGREGATOR_BUCKET_NAME: ${R2_AGGREGATOR_BUCKET_NAME:-}
  R2_AGGREGATOR_READ_ACCESS_KEY_ID: ${R2_AGGREGATOR_READ_ACCESS_KEY_ID:-}
  R2_AGGREGATOR_READ_SECRET_ACCESS_KEY: ${R2_AGGREGATOR_READ_SECRET_ACCESS_KEY:-}
  R2_AGGREGATOR_WRITE_ACCESS_KEY_ID: ${R2_AGGREGATOR_WRITE_ACCESS_KEY_ID:-}
  R2_AGGREGATOR_WRITE_SECRET_ACCESS_KEY: ${R2_AGGREGATOR_WRITE_SECRET_ACCESS_KEY:-}
  R2_DATASET_ACCOUNT_ID: ${R2_DATASET_ACCOUNT_ID}
  R2_DATASET_BUCKET_NAME: ${R2_DATASET_BUCKET_NAME}
  R2_DATASET_READ_ACCESS_KEY_ID: ${R2_DATASET_READ_ACCESS_KEY_ID}
  R2_DATASET_READ_SECRET_ACCESS_KEY: ${R2_DATASET_READ_SECRET_ACCESS_KEY}
  DATASET_BINS_PATH: ${DATASET_BINS_PATH:-tokenized/}
  # Optional integrations.
  WANDB_API_KEY: ${WANDB_API_KEY:-}
  HF_TOKEN: ${HF_TOKEN:-}
  DASHBOARD_API_URL: ${DASHBOARD_API_URL:-https://api.hone.training}
  DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-}
  # Subtensor / chain.
  NETUID: ${NETUID:-268}
  SUBTENSOR_NETWORK: ${SUBTENSOR_NETWORK:-finney}
  SUBTENSOR_CHAIN_ENDPOINT: ${SUBTENSOR_CHAIN_ENDPOINT:-}
  # NCCL: stick to a single device per process within each container,
  # the entrypoint flips to torchrun when NPROC_PER_NODE > 1.
  NCCL_ASYNC_ERROR_HANDLING: "1"
  NCCL_IB_DISABLE: "1"
  NCCL_P2P_DISABLE: "0"

x-build: &build
  context: ..
  dockerfile: docker/Dockerfile

x-common-volumes: &common-volumes
  # Wallet directory shared across the host -- each container reads
  # ~/.bittensor/wallets/<WALLET_NAME>/hotkeys/<WALLET_HOTKEY>.
  - ${BITTENSOR_WALLETS_DIR:-~/.bittensor/wallets}:/root/.bittensor/wallets:ro
  # Mount the source tree over /app so edits to hone/* land instantly
  # (the package was installed in editable mode in the Dockerfile).
  - ../:/app:rw
  # Logs land here.
  - ./logs:/app/logs:rw
  # Reuse the host's HF cache so we don't redownload tokenizers per
  # container (-> 3 hits per stack startup otherwise).
  - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface

# Bridge network. Containers reach each other by service name
# (miner-s0 connects to miner-s1) over Docker's embedded DNS.
networks:
  hone-net:
    driver: bridge

services:

  # ----------------------------- VALIDATOR ---------------------------
  validator:
    build: *build
    image: hone:latest
    pull_policy: build  # don't try to pull hone:latest from a registry
    hostname: validator
    container_name: hone-validator
    runtime: nvidia
    networks: [hone-net]
    volumes: *common-volumes
    environment:
      <<: *common-env
      NODE_TYPE: validator
      WALLET_NAME: ${VALIDATOR_WALLET_NAME}
      WALLET_HOTKEY: ${VALIDATOR_WALLET_HOTKEY}
      HONE_EXTRA_FLAGS: ${VALIDATOR_EXTRA_FLAGS:-}
      # NVIDIA_VISIBLE_DEVICES takes a CSV ("0,1,2,3") so we can
      # parameterise the multi-GPU layout from .env without juggling
      # YAML lists. NPROC_PER_NODE drives torchrun in the entrypoint;
      # match it to the count of GPUs and to fsdp.dp_shard in
      # hparams.json or FSDP won't shard the model.
      NVIDIA_VISIBLE_DEVICES: ${VALIDATOR_GPU_IDS:-0,1}
      NPROC_PER_NODE: ${VALIDATOR_NPROC:-2}
    restart: unless-stopped

  # ----------------------------- MINER STAGES ------------------------
  # All stages share ${MINER_WALLET_NAME}/${MINER_WALLET_HOTKEY} -- the
  # subnet sees one UID, with per-stage gradient files on R2 keyed by
  # the ``-stage{N}`` suffix that ``Comms.put`` adds when ``stage_id``
  # is set.

  miner-s0:
    # NOTE: no ``build:`` -- the validator service is the sole build
    # target for ``hone:latest``. Without this miners would each
    # invoke their own (identical) build job and re-export the
    # finished image to the local store, multiplying the slow
    # "exporting layers" step by 3. ``pull_policy: never`` tells
    # compose to use whatever's already tagged locally.
    image: hone:latest
    pull_policy: never
    hostname: miner-s0
    container_name: hone-miner-s0
    runtime: nvidia
    networks: [hone-net]
    volumes: *common-volumes
    environment:
      <<: *common-env
      NODE_TYPE: miner
      WALLET_NAME: ${MINER_WALLET_NAME}
      WALLET_HOTKEY: ${MINER_WALLET_HOTKEY}
      PP_STAGE: "0"
      PP_NUM_STAGES: "${PP_NUM_STAGES:-3}"
      # Stage 0 only sends *forward* to stage 1 and receives *grad*
      # back. ``--pp-peer-host-prev`` is unused on stage 0; we pass the
      # default 127.0.0.1 from the entrypoint.
      PP_PEER_HOST_NEXT: miner-s1
      PP_PEER_PORT_BASE_NEXT: "50000"
      PP_LISTEN_PORT_BASE: "50000"
      HONE_EXTRA_FLAGS: ${MINER_EXTRA_FLAGS:-}
      # NVIDIA_VISIBLE_DEVICES takes a CSV ("2,3") so we can
      # parameterise multi-GPU intra-stage FSDP from .env. The
      # entrypoint flips to torchrun when NPROC_PER_NODE > 1; match
      # it to the GPU count and to fsdp.dp_shard in hparams.json.
      NVIDIA_VISIBLE_DEVICES: ${MINER_S0_GPU_IDS:-2,3}
      NPROC_PER_NODE: ${MINER_S0_NPROC:-2}
      # Each torchrun world needs its own master_port: stage 0 and
      # stage 1 run separate NCCL worlds, both bind to localhost in
      # their own netns, but using distinct ports keeps logs clean
      # and avoids any future single-host orchestration confusion.
      MASTER_PORT: "29500"
    depends_on: [validator]
    restart: unless-stopped

  miner-s1:
    # See comment on miner-s0: image is built once by the validator
    # service. ``depends_on: [validator]`` below ensures the build
    # has happened before this service starts.
    #
    # MIDDLE stage in a >=3-stage pipeline: needs BOTH PP_PEER_HOST_PREV
    # (to receive activations from miner-s0) and PP_PEER_HOST_NEXT
    # (to forward activations to miner-s2). When PP_NUM_STAGES=2 the
    # _NEXT chain just dangles harmlessly -- stage 1 is then the tail
    # and never opens a forward connection.
    image: hone:latest
    pull_policy: never
    hostname: miner-s1
    container_name: hone-miner-s1
    runtime: nvidia
    networks: [hone-net]
    volumes: *common-volumes
    environment:
      <<: *common-env
      NODE_TYPE: miner
      WALLET_NAME: ${MINER_WALLET_NAME}
      WALLET_HOTKEY: ${MINER_WALLET_HOTKEY}
      PP_STAGE: "1"
      PP_NUM_STAGES: "${PP_NUM_STAGES:-3}"
      PP_PEER_HOST_PREV: miner-s0
      PP_PEER_PORT_BASE_PREV: "50000"
      PP_PEER_HOST_NEXT: miner-s2
      PP_PEER_PORT_BASE_NEXT: "50000"
      PP_LISTEN_PORT_BASE: "50000"
      HONE_EXTRA_FLAGS: ${MINER_EXTRA_FLAGS:-}
      NVIDIA_VISIBLE_DEVICES: ${MINER_S1_GPU_IDS:-4,5}
      NPROC_PER_NODE: ${MINER_S1_NPROC:-2}
      MASTER_PORT: "29500"
    depends_on: [validator]
    restart: unless-stopped

  miner-s2:
    # Tail stage in the default 3-stage layout. Receives activations
    # from miner-s1 and computes the LM head + loss. No PP_PEER_HOST_NEXT
    # (the entrypoint defaults that to 127.0.0.1, and ``--pp-stage``
    # being the last stage means PPTransport never opens a forward
    # connection).
    image: hone:latest
    pull_policy: never
    hostname: miner-s2
    container_name: hone-miner-s2
    runtime: nvidia
    networks: [hone-net]
    volumes: *common-volumes
    environment:
      <<: *common-env
      NODE_TYPE: miner
      WALLET_NAME: ${MINER_WALLET_NAME}
      WALLET_HOTKEY: ${MINER_WALLET_HOTKEY}
      PP_STAGE: "2"
      PP_NUM_STAGES: "${PP_NUM_STAGES:-3}"
      PP_PEER_HOST_PREV: miner-s1
      PP_PEER_PORT_BASE_PREV: "50000"
      PP_LISTEN_PORT_BASE: "50000"
      HONE_EXTRA_FLAGS: ${MINER_EXTRA_FLAGS:-}
      NVIDIA_VISIBLE_DEVICES: ${MINER_S2_GPU_IDS:-6,7}
      NPROC_PER_NODE: ${MINER_S2_NPROC:-2}
      MASTER_PORT: "29500"
    depends_on: [validator]
    restart: unless-stopped
