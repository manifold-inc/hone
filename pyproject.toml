[project]
name = "hone"
version = "0.1.0"
description = "Slim SparseLoCo distributed training for Bittensor subnet 5"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7",
    "transformers>=4.50",
    "bittensor>=9.10",
    "bittensor-wallet>=4.0",
    "aioboto3>=13.0",
    "zstandard>=0.23",
    "openskill>=6.0",
    "pyarrow>=18.0",
    "numpy>=1.26",
    "aiohttp>=3.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
